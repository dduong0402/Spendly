name: Deploy

# Chạy sau khi CI trên nhánh main thành công (hoặc bấm tay trong tab Actions).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Publish
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/Spendly.Web/Spendly.Web.csproj -c Release -o ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: spendly-web
          path: ./publish
          retention-days: 7

  deploy-azure:
    name: Deploy lên Azure App Service
    needs: build
    # Chỉ chạy khi đã khai báo Variable AZURE_WEBAPP_NAME (xem HUONG-DAN-BUOC-13.md).
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spendly-web
          path: ./publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
