name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            src/Spendly.Web/Spendly.Web.csproj
            tests/Spendly.Tests/Spendly.Tests.csproj

      - name: Restore
        run: dotnet restore Spendly.sln

      - name: Build
        run: dotnet build Spendly.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Spendly.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results & coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          retention-days: 14

      - name: Test summary
        if: always()
        run: |
          echo "### Kết quả test" >> "$GITHUB_STEP_SUMMARY"
          for f in $(find TestResults -name '*.trx'); do
            total=$(grep -o 'total="[0-9]*"' "$f" | head -1)
            passed=$(grep -o 'passed="[0-9]*"' "$f" | head -1)
            failed=$(grep -o 'failed="[0-9]*"' "$f" | head -1)
            echo "- $total, $passed, $failed" >> "$GITHUB_STEP_SUMMARY"
          done

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (không push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
